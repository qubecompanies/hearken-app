<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hearken</title>
    <script>
      // Single Page App redirect fix for GitHub Pages
      // Converts path to query string so index.html can restore it
      // pathSegmentsToKeep = 1 keeps /hearken-app/ in the URL
      (function() {
        var l = window.location;
        var pathSegmentsToKeep = 1;
        var pathSegments = l.pathname.split('/');
        var keepSegments = pathSegments.slice(0, 1 + pathSegmentsToKeep).join('/');
        var restSegments = pathSegments.slice(1 + pathSegmentsToKeep).join('/');
        var search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
        var hash = l.hash;
        var redirectPath = l.protocol + '//' + l.hostname +
          (l.port ? ':' + l.port : '') +
          keepSegments + '/?/' +
          restSegments.replace(/&/g, '~and~') +
          search + hash;
        l.replace(redirectPath);
      })();
    </script>
  </head>
  <body></body>
</html>
